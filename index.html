
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsplash Image Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Unsplash Image Search</h1>
    <p>Search for beautiful photos using Unsplash API</p>

    <input type="text" id="searchInput"
           placeholder="Search for images...">

    <div class="buttons">
      <button id="xhrBtn">Search with XHR</button>
      <button id="promiseBtn">Search with Promises</button>
      <button id="asyncBtn">Search with Async/Await</button>
    </div>

    <p id="message"></p>

    <div id="imageContainer"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
